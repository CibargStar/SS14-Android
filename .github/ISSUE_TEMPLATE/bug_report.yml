name: Ошибка Android-порта
description: Сбой, несовместимость сервера или проблема управления
body:
  - type: input
    id: version
    attributes:
      label: Версия APK
      placeholder: 0.10.0-dev, arm64-coreclr
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Устройство и Android
      placeholder: Модель устройства, версия Android
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Сервер и версия движка
      description: Для проблемы подключения; не публикуйте приватные адреса.
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      description: Шаги, ожидаемое поведение и фактический результат.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Логи и снимки
      description: Приложите файл лога без токенов и личных данных; для crash полезен adb logcat.
