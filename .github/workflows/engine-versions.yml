name: Build exact Android engine versions

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Exact upstream engine versions to build
        type: choice
        options: [recent, observed-hub]
        default: recent
      versions:
        description: Optional comma-separated exact versions (overrides scope)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Check authorized engine catalog redirects
        run: python3 -m unittest discover -s tests -p test_update_catalog.py
      - id: select
        env:
          SCOPE: ${{ inputs.scope }}
          EXACT_VERSIONS: ${{ inputs.versions }}
        run: |
          python3 - <<'PY'
          import json, os, re
          recent = ['294.0.0', '294.0.1', '293.0.1', '292.0.1', '291.0.2', '290.0.2', '289.0.5']
          versions = list(json.load(open('docs/engine-versions-observed.json'))['canonical_after_official_redirects']) if os.environ['SCOPE'] == 'observed-hub' else recent
          if os.environ.get('EXACT_VERSIONS', '').strip():
              versions = list(dict.fromkeys(v.strip() for v in os.environ['EXACT_VERSIONS'].split(',')))
          if not 1 <= len(versions) <= 50 or any(not re.fullmatch(r'[0-9]+(?:\.[0-9]+){2,3}(?:-[A-Za-z0-9._-]+)?', v) for v in versions):
              raise SystemExit('Expected 1–50 exact upstream engine versions.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(versions) + '\n')
          PY
  engine:
    needs: versions
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Apply Android platform changes to exact upstream sources
        run: python3 scripts/prepare-engine-version.py '${{ matrix.version }}'
      - name: Build original engine for Android
        run: >-
          dotnet build engine/versions/${{ matrix.version }}/Robust.Client/Robust.Client.csproj
          -c Release -p:FullRelease=True -p:TargetOS=Android -m:1
          -p:BuildInParallel=false -p:UseSharedCompilation=false --nologo
      - name: Package development artifact for verification and external signing
        run: |
          mkdir -m 700 .keys
          openssl genpkey -algorithm ED25519 -out .keys/temporary.pem
          python3 scripts/package-android-engine.py --engine engine/versions/${{ matrix.version }} --key .keys/temporary.pem --version '${{ matrix.version }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ss14-android-engine-${{ matrix.version }}
          path: artifacts/engines/
