name: Build Android client components

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      rid:
        description: Android ABI
        type: choice
        options: [android-arm64, android-x64]
        default: android-arm64
      runtime:
        description: Managed runtime for internal compatibility checks
        type: choice
        options: [mono, coreclr]
        default: mono

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SS14_ANDROID_ABI: ${{ inputs.rid == 'android-x64' && 'x86_64' || 'arm64-v8a' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: dotnet workload install android --skip-manifest-update
      - name: Prepare original launcher port
        run: bash scripts/prepare-original-launcher.sh
      - name: Test original launcher, dialogs and persistence
        run: dotnet run --project tests/OriginalLauncher.Tests -p:AndroidLauncher=true -c Debug
      - name: Build platform-patched engine
        run: bash scripts/build-engine.sh
      - name: Package engine with an ephemeral development signature
        run: |
          mkdir -m 700 .keys
          openssl genpkey -algorithm ED25519 -out .keys/ci-engine.pem
          python3 scripts/package-android-engine.py --key .keys/ci-engine.pem --version 294.0.1
      - uses: actions/upload-artifact@v4
        with:
          name: ss14-managed-android-engine
          path: artifacts/engines/
      - name: Build Android SDL
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.2.12479018'
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bash scripts/build-native-sdl.sh
          bash scripts/build-native-libraries.sh
          bash scripts/build-native-sodium.sh
      - name: Build launcher APK
        run: >-
          bash scripts/build-original-launcher.sh
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:JavaSdkDirectory="$JAVA_HOME"
          -p:RuntimeIdentifier=${{ inputs.rid || 'android-arm64' }}
          -p:UseMonoRuntime=${{ inputs.runtime == 'coreclr' && 'false' || 'true' }}
      - uses: actions/upload-artifact@v4
        with:
          name: ss14-android-development-components
          path: |
            src/SS14.Android/bin/Debug/net10.0-android/${{ inputs.rid || 'android-arm64' }}/*-Signed.apk
            artifacts/native/${{ env.SS14_ANDROID_ABI }}/
