name: Build Android client components

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      rid:
        description: Android ABI
        type: choice
        options: [android-arm64, android-x64]
        default: android-arm64
      runtime:
        description: Managed runtime for internal compatibility checks
        type: choice
        options: [mono, coreclr]
        default: mono
      engine_channel:
        description: Engine signing channel
        type: choice
        options: [temporary, published]
        default: temporary
      version_code:
        description: Android package version code
        type: string
        default: '10'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SS14_ANDROID_ABI: ${{ inputs.rid == 'android-x64' && 'x86_64' || 'arm64-v8a' }}
      SS14_APK_VERSION_CODE: ${{ inputs.version_code || '10' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: dotnet workload install android --skip-manifest-update
      - name: Prepare original launcher port
        run: |
          bash scripts/prepare-original-launcher.sh
          bash scripts/prepare-engine.sh
      - name: Test original launcher, dialogs and persistence
        run: dotnet run --project tests/OriginalLauncher.Tests -p:AndroidLauncher=true -c Debug
      - name: Test phone display sizing and cross-process preferences
        run: dotnet run --project tests/AndroidDisplay.Checks -c Release
      - name: Test movement stick ownership, deadzone and direction stability
        run: dotnet run --project tests/Thumbstick.Checks -c Release
      - name: Test world gestures and UI pointer arbitration
        run: dotnet run --project tests/CameraGesture.Checks -c Release
      - name: Test Android physical pointer ownership and release
        run: dotnet run --project tests/AndroidInput.Checks -c Release
      - name: Build platform-patched engine
        if: inputs.engine_channel != 'published'
        run: bash scripts/build-engine.sh
      - name: Package engine with an ephemeral development signature
        if: inputs.engine_channel != 'published'
        run: |
          mkdir -m 700 .keys
          openssl genpkey -algorithm ED25519 -out .keys/ci-engine.pem
          python3 scripts/package-android-engine.py --key .keys/ci-engine.pem --version 294.0.1
      - name: Bundle engines verified against the stable channel public key
        if: inputs.engine_channel == 'published'
        run: >-
          python3 scripts/fetch-channel-engines.py
          --catalog https://raw.githubusercontent.com/CibargStar/SS14-Android/updates/engines.json
          --key updates/android-engine-public.pub
          --bundle-version 294.0.0 --bundle-version 294.0.1
      - uses: actions/upload-artifact@v4
        with:
          name: ss14-managed-android-engine
          path: artifacts/engines/
      - uses: actions/cache@v4
        id: native-cache
        with:
          path: artifacts/native/${{ env.SS14_ANDROID_ABI }}/
          key: ss14-native-ndk27-v1-${{ runner.os }}-${{ env.SS14_ANDROID_ABI }}-${{ hashFiles('scripts/build-native-*.sh') }}
      - name: Build Android SDL
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.2.12479018'
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bash scripts/build-native-sdl.sh
          bash scripts/build-native-libraries.sh
          bash scripts/build-native-sodium.sh
      - name: Build launcher APK
        run: >-
          bash scripts/build-original-launcher.sh
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:JavaSdkDirectory="$JAVA_HOME"
          -p:RuntimeIdentifier=${{ inputs.rid || 'android-arm64' }}
          -p:UseMonoRuntime=${{ inputs.runtime == 'coreclr' && 'false' || 'true' }}
          -p:ApplicationVersion="$SS14_APK_VERSION_CODE"
      - uses: actions/upload-artifact@v4
        with:
          name: ss14-android-development-components
          path: |
            src/SS14.Android/bin/Debug/net10.0-android/${{ inputs.rid || 'android-arm64' }}/*-Signed.apk
            artifacts/native/${{ env.SS14_ANDROID_ABI }}/
