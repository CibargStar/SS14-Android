name: Publish externally signed engine packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable engine release tag
        type: string
        default: android-engines-20261029-11

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: engine-staging
          path: staging
      - name: Verify every uploaded package against the pinned public key
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path('staging')
          files = json.loads((root / 'payloads.json').read_text())
          for name, digest in files.items():
              path = root / name
              if path.name != name or hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                  raise SystemExit('Unexpected staging payload: ' + name)
              if name.endswith(('.zip', '.ss14patch')):
                  subprocess.run(['openssl', 'pkeyutl', '-verify', '-pubin', '-rawin',
                      '-inkey', 'updates/android-engine-public.pub', '-in', str(path),
                      '-sigfile', str(path) + '.sig'], check=True)
          PY
      - name: Upload verified packages to the development release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft --prerelease --title "Signed Android engines: $RELEASE_TAG" --notes-file staging/notes.md
          shopt -s nullglob
          payloads=(staging/Robust.Client.Android-*.zip staging/Robust.Client.Android-*.zip.sig staging/Robust.Client.Android-*.ss14patch staging/Robust.Client.Android-*.ss14patch.sig)
          (cd staging && sha256sum Robust.Client.Android-*.zip Robust.Client.Android-*.zip.sig Robust.Client.Android-*.ss14patch Robust.Client.Android-*.ss14patch.sig) > staging/SHA256SUMS
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${payloads[@]}" staging/SHA256SUMS
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
